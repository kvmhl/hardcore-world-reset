name: HardcoreWorldReset
version: ${project.version}
main: com.github.kdltmhl.hardcoreworldreset.HardcoreWorldReset
api-version: '1.21'
author: kdltmhl
description: >
  Standalone plugin that resets the world on player death in hardcore mode.
  Built for Minecraft 1.21.5. Includes speedrun timer, cross-world portal
  handling, seamless/disconnect world swap methods, and fully automatic
  world management — no Multiverse required.
website: https://github.com/kvmhl/hardcore-world-reset

# No external dependencies required — fully standalone!
# depend: []

# Soft dependencies for optional integration
# softdepend: []

commands:
  hwr:
    description: HardcoreWorldReset admin commands
    usage: /hwr <reload|status|reset>
    permission: hardcoreworldreset.admin
    aliases: [hardcoreworldreset, hwreset]

permissions:
  hardcoreworldreset.admin:
    description: Access to all /hwr admin commands
    default: op
  hardcoreworldreset.bypass:
    description: Bypass death-triggered world reset (for admins/spectators)
    default: false