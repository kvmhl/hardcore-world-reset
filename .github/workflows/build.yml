name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Trigger on version tags (e.g., v2.0.0)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Verify tag matches Maven version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
        test "$TAG_VERSION" = "$POM_VERSION" || {
          echo "Tag version $TAG_VERSION does not match pom.xml version $POM_VERSION"
          exit 1
        }
        
    - name: Build with Maven
      run: mvn -B clean verify --file pom.xml

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HardcoreWorldReset-Jar
        path: target/HardcoreWorldReset-*.jar
        retention-days: 5

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: target/HardcoreWorldReset-*.jar
        generate_release_notes: true
