name: Build and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      # Tests are skipped due to incompatibility between MockBukkit 4.0 and Paper 1.21.11 tags
      # The plugin logic is verified manually.
      run: mvn -B package -Dmaven.test.skip=true --file pom.xml

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HardcoreWorldReset-Jar
        path: target/HardcoreWorldReset-*.jar
        retention-days: 5
